[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "survivor-knowledge-graph"
version = "0.1.0"
description = "A comprehensive RDF/JSON-LD knowledge graph of 50 seasons of Survivor (US)"
requires-python = ">=3.10"
dependencies = [
    "rdflib>=7.0",
    "pyld>=2.0",
    "pyshacl>=0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "jupyterlite-core>=0.3",
]
analytics = [
    "pandas>=2.0",
    "plotly>=5.0",
    "jupyter>=1.0",
]
all = [
    "survivor-knowledge-graph[dev,docs,analytics]",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
