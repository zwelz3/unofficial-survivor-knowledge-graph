  var NL={S:function(d){return"S"+d.id.replace("s","")},R:function(d){return(d.tp||0)>=3?d.l.split(" ").pop():""},T:function(d){return d.l},I:function(){return""},L:function(d){return d.l.split(",")[0]},M:function(d){return d.l.split(" ")[0]},W:function(d){return d.l.split(" ").pop()},E:function(d){return"E"+d.en}};
  var ECOL={returning_player:"#e5a10066",has_tribe:"#5a7a5a55",idol_in:"#e5a10044",filmed_at:"#f472b666",uses_mechanic:"#fb923c55",won:"#e5a10088",in_season:"#6366f166"};
  var BC={S:"#e5a100",R:"#00b4d8",T:"#5a7a5a",I:"#e5a100",L:"#f472b6",M:"#fb923c",W:"#fbbf24",E:"#6366f1"};
  function getR(d){var r=NR[d.t];return typeof r==="function"?r(d):r}

  var show={S:true,R:true,T:false,I:false,L:false,M:false,W:false,E:false};
  var selId=null,selSeason=null,sim=null;

  // Build UI
  var h='<div class="lb" id="gl">';
  "S R T I L M W E".split(" ").forEach(function(t){
    h+='<button class="'+(show[t]?"on":"off")+'" data-t="'+t+'" style="background:'+(show[t]?BC[t]+"18":"transparent")+';color:'+(show[t]?BC[t]:"#444")+'"><span style="font-size:clamp(10px,1.1vw,14px)">'+ICON[t]+'</span>'+NM[t]+'</button>';
  });
  h+='<span style="margin-left:auto;font-size:clamp(7px,0.7vw,9px);color:#556" id="gc"></span></div>';
  h+='<div id="epH" style="font-size:clamp(8px,0.75vw,10px);color:#556;margin-bottom:4px;display:none">\u2191 Click a season to expand its episodes</div>';
  h+='<div class="c" style="padding:0;height:max(300px,calc(100dvh - 170px));height:max(300px,calc(100vh - 170px));position:relative">';
  h+='<svg id="gs" style="width:100%;height:100%;background:#0c0d14;display:block;touch-action:none"></svg>';
  h+='<div class="gi" id="gi"></div></div>';
  ct.innerHTML=h;

  // Legend click handlers
  document.querySelectorAll("#gl button").forEach(function(b){
    b.addEventListener("click",function(){
      var t=b.getAttribute("data-t");
      show[t]=!show[t];
      document.getElementById("epH").style.display=show.E?"block":"none";
      rebuild();
    });
  });

  var svg=d3.select("#gs");
  var gEl=svg.append("g");
  var zb=d3.zoom().scaleExtent([0.05,8]).on("zoom",function(e){gEl.attr("transform",e.transform)});
  svg.call(zb);

  function getEpNodes(sn){
    var ed=EP[sn];if(!ed)return{n:[],e:[]};
    var nodes=ed.map(function(e){return{id:"ep"+sn+"-"+e[0],t:"E",l:"E"+e[0]+": "+e[2],en:e[0],et:e[1]||"",title:e[2],elims:e[3],chals:e[4],idols:e[5],notable:e[6],vw:e[7],sn:sn}});
    var edges=nodes.map(function(n){return{s:n.id,t:"s"+sn,r:"in_season"}});
    return{n:nodes,e:edges};
  }

  function rebuild(){
    // Update legend
    document.querySelectorAll("#gl button").forEach(function(b){
      var t=b.getAttribute("data-t");
      b.className=show[t]?"on":"off";
      b.style.background=show[t]?BC[t]+"18":"transparent";
      b.style.color=show[t]?BC[t]:"#444";
    });

    // Collect nodes (fresh copies)
    var nodes=[],edges=[];
    if(show.S) G.base.n.forEach(function(n){if(n.t==="S")nodes.push(Object.assign({},n))});
    if(show.R) G.base.n.forEach(function(n){if(n.t==="R")nodes.push(Object.assign({},n))});
    if(show.T) G.tribes.n.forEach(function(n){nodes.push(Object.assign({},n))});
    if(show.I) G.idols.n.forEach(function(n){nodes.push(Object.assign({},n))});
    if(show.L) G.locations.n.forEach(function(n){nodes.push(Object.assign({},n))});
    if(show.M) G.mechanics.n.forEach(function(n){nodes.push(Object.assign({},n))});
    if(show.W) G.winners.n.forEach(function(n){nodes.push(Object.assign({},n))});
    if(show.S&&show.R) edges=edges.concat(G.base.e);
    if(show.T) edges=edges.concat(G.tribes.e);
    if(show.I) edges=edges.concat(G.idols.e);
    if(show.L) edges=edges.concat(G.locations.e);
    if(show.M) edges=edges.concat(G.mechanics.e);
    if(show.W) edges=edges.concat(G.winners.e);
    if(show.E&&selSeason){var eg=getEpNodes(selSeason);nodes=nodes.concat(eg.n);edges=edges.concat(eg.e)}

    // Filter and dedup edges
    var nids={};nodes.forEach(function(n){nids[n.id]=true});
    var seenE={};
    edges=edges.filter(function(e){
      if(!nids[e.s]||!nids[e.t])return false;
      var k=e.s+"|"+e.t;if(seenE[k])return false;seenE[k]=true;return true;
    });

    // Random positions
    var spread=Math.max(300,Math.sqrt(nodes.length)*28);
    nodes.forEach(function(n){n.x=(Math.random()-0.5)*spread;n.y=(Math.random()-0.5)*spread});

    document.getElementById("gc").textContent=nodes.length+" nodes, "+edges.length+" edges"+(selSeason&&show.E?" | S"+selSeason:"");

    // Clear
    gEl.selectAll("*").remove();
    if(sim){sim.stop();sim=null}
    if(nodes.length===0)return;

    // Force simulation
    sim=d3.forceSimulation(nodes)
      .force("link",d3.forceLink(edges).id(function(d){return d.id})
        .distance(function(d){return({in_season:22,won:28,has_tribe:32,idol_in:32,filmed_at:50,uses_mechanic:42})[d.r]||65})
        .strength(function(d){return({in_season:0.7,returning_player:0.06,has_tribe:0.2,idol_in:0.25,filmed_at:0.2,uses_mechanic:0.2,won:0.3})[d.r]||0.1}))
      .force("charge",d3.forceManyBody().strength(function(d){return({S:-200,L:-150,M:-120,R:-30,T:-20,W:-25,I:-10,E:-12})[d.t]||-20}))
      .force("center",d3.forceCenter(0,0).strength(0.05))
      .force("collision",d3.forceCollide().radius(function(d){return getR(d)+3}))
      .alphaDecay(0.008)
      .velocityDecay(0.3);

    var lnk=gEl.append("g");
    var ndg=gEl.append("g");

    sim.on("tick",function(){
      // Draw edges
      var lines=lnk.selectAll("line").data(edges);
      lines.exit().remove();
      var linesEnter=lines.enter().append("line");
      lines=linesEnter.merge(lines);
      lines.attr("x1",function(d){return d.source.x}).attr("y1",function(d){return d.source.y})
        .attr("x2",function(d){return d.target.x}).attr("y2",function(d){return d.target.y})
        .attr("stroke",function(d){if(selId&&(d.source.id===selId||d.target.id===selId))return"#fff";return ECOL[d.r]||"#ffffff0a"})
        .attr("stroke-width",function(d){return(selId&&(d.source.id===selId||d.target.id===selId))?2:0.6});

      // Draw nodes
      var nd=ndg.selectAll("g.n").data(nodes,function(d){return d.id});
      nd.exit().remove();
      var en=nd.enter().append("g").attr("class","n").style("cursor","pointer");
      en.on("click",function(ev,d){
        selId=(selId===d.id)?null:d.id;
        if(d.t==="S"){selSeason=parseInt(d.id.replace("s",""));if(show.E)rebuild()}
        showI(d);
      });
      en.each(function(d){
        var g=d3.select(this),r=getR(d);
        if(d.t==="T") g.append("rect").attr("width",r*2).attr("height",r*2).attr("x",-r).attr("y",-r).attr("rx",2);
        else if(d.t==="I") g.append("rect").attr("width",r*1.5).attr("height",r*1.5).attr("x",-r*0.75).attr("y",-r*0.75).attr("rx",1).attr("transform","rotate(45)");
        else if(d.t==="M") g.append("polygon").attr("points","0,"+-r+" "+r+",0 0,"+r+" "+-r+",0");
        else if(d.t==="L"){var p=[];for(var i=0;i<6;i++){var a=Math.PI/3*i-Math.PI/2;p.push(Math.cos(a)*r+","+Math.sin(a)*r)}g.append("polygon").attr("points",p.join(" "))}
        else g.append("circle").attr("r",r);
        if(d.t==="W") g.append("text").attr("text-anchor","middle").attr("dominant-baseline","central").attr("font-size",9).text("\u{1F451}");
        g.append("text").attr("class","lb2").attr("text-anchor","middle").attr("font-family","DM Mono,monospace");
      });
      var mg=en.merge(nd);
      mg.attr("transform",function(d){return"translate("+d.x+","+d.y+")"});
      mg.select("circle,rect,polygon")
        .attr("fill",function(d){return NC[d.t](d)})
        .attr("opacity",function(d){return(selId&&selId!==d.id)?0.15:0.85})
        .attr("stroke",function(d){return selId===d.id?"#fff":"#ffffff10"})
        .attr("stroke-width",function(d){return selId===d.id?2:0.5});
      mg.select(".lb2")
        .attr("y",function(d){return getR(d)+10})
        .attr("fill",function(d){return selId===d.id?"#fff":"#777"})
        .attr("font-size",function(d){return d.t==="S"?7:d.t==="L"||d.t==="M"?6:5})
        .text(function(d){return NL[d.t](d)});
    });

    // Auto-fit camera after layout settles
    setTimeout(function(){
      var w=svg.node().getBoundingClientRect().width||700;
      var hh=svg.node().getBoundingClientRect().height||400;
      var minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
      nodes.forEach(function(d){if(d.x<minX)minX=d.x;if(d.x>maxX)maxX=d.x;if(d.y<minY)minY=d.y;if(d.y>maxY)maxY=d.y});
      if(!isFinite(minX)){minX=-100;maxX=100;minY=-100;maxY=100}
      var cx=(minX+maxX)/2,cy=(minY+maxY)/2;
      var dx=Math.max(maxX-minX+80,100),dy=Math.max(maxY-minY+80,100);
      var scale=Math.min(w/dx,hh/dy,1.2);
      svg.transition().duration(700).call(zb.transform,d3.zoomIdentity.translate(w/2-cx*scale,hh/2-cy*scale).scale(scale));
    },900);
  }

  function showI(d){
    var el=document.getElementById("gi");
    if(!selId){el.classList.remove("show");return}
    el.classList.add("show");
    var lab={S:"Season",R:"Player",T:"Tribe",I:"Idol Event",L:"Location",M:"Mechanic",W:"Winner",E:"Episode"};
    var h='<div style="font-size:clamp(7px,0.65vw,9px);color:#556;text-transform:uppercase;letter-spacing:.1em">'+ICON[d.t]+" "+lab[d.t]+'</div>';
    h+='<h4 style="color:'+NC[d.t](d)+'">'+d.l+'</h4>';
    if(d.t==="S") h+="<div>Winner: "+(d.w||"?")+"</div><div>FTC: "+(d.v||"?")+"</div><div>Era: "+d.era+"</div><div>Cast: "+d.c+"</div><div>Days: "+d.days+"</div><div>Location: "+(d.loc||"?")+"</div>";
    else if(d.t==="R") h+="<div>Played: "+(d.tp||"?")+"x</div><div>Seasons: "+(d.ss||[]).join(", ")+"</div>";
    else if(d.t==="T") h+="<div>Season: S"+d.sn+"</div><div>Members: "+(d.m||"?")+"</div>";
    else if(d.t==="I") h+="<div>S"+d.sn+"E"+d.en+"</div><div>Type: "+(d.it||"").replace(/_/g," ")+"</div><div>Player: "+d.p+"</div>"+(d.n?"<div style='margin-top:3px;color:#777'>"+d.n+"</div>":"")+(d.vn!=null?"<div>Votes negated: "+d.vn+"</div>":"");
    else if(d.t==="L"){var c2=G.locations.e.filter(function(e){return e.t===d.id}).length;h+="<div>"+c2+" season"+(c2!==1?"s":"")+" filmed here</div>"}
    else if(d.t==="M"){var c2=G.mechanics.e.filter(function(e){return e.t===d.id}).length;h+="<div>Used in "+c2+" season"+(c2!==1?"s":"")+"</div>"}
    else if(d.t==="W") h+="<div>Season: S"+d.sn+"</div><div>FTC: "+(d.vote||"")+"</div>";
    else if(d.t==="E"){
      h+='<div style="color:'+(ETC[d.et]||"#888")+'">'+(ETN[d.et]||"Episode")+'</div>';
      if(d.vw)h+="<div>Viewers: "+d.vw+"M</div>";
      if(d.elims)String(d.elims).split("|").filter(Boolean).forEach(function(p){h+="<div>\u274C "+p+"</div>"});
      if(d.chals)String(d.chals).split("|").filter(Boolean).forEach(function(p){var pp=p.split(":");h+="<div>"+(pp[0]==="i"?"\u{1F6E1}\uFE0F":"\u{1F381}")+" "+(pp[1]||"")+"</div>"});
      if(d.idols)String(d.idols).split("|").filter(Boolean).forEach(function(p){var pp=p.split(":");h+="<div>\u{1F48E} "+(pp[0]||"")+": "+(pp[1]||"")+"</div>"});
      if(d.notable)h+='<div style="margin-top:3px;color:#888;font-size:clamp(8px,0.75vw,10px)">'+d.notable+'</div>';
    }
    h+='<button onclick="document.getElementById(\'gi\').classList.remove(\'show\')" style="margin-top:6px;padding:3px 6px;font:clamp(8px,0.75vw,10px) \'DM Mono\',monospace;background:#1a1b2a;border:1px solid #1a1b2a;border-radius:3px;color:#556;cursor:pointer;width:100%">Clear</button>';
    el.innerHTML=h;
  }

  // Initial build
  rebuild();
}

function rQuality(){
  var q=D.quality,t=q.total;
  var f=[{l:"Titles",v:q.title,c:"#00c896"},{l:"Dates",v:q.date,c:"#00c896"},{l:"Views",v:q.view,c:"#00c896"},{l:"Notable",v:q.notable,c:"#00c896"},{l:"Tribal",v:q.tc,c:"#00c896"},{l:"Challenges",v:q.chal,c:"#e5a100"},{l:"Immunity",v:q.imm,c:"#e5a100"},{l:"Reward",v:q.rew,c:"#00b4d8"},{l:"Idols",v:q.idol,c:"#8b5cf6"},{l:"Detailed",v:q.detailed,c:"#00c896"}];
  var h='<div class="g g2"><div class="c"><h3>Field Coverage ('+t+' eps)</h3>'+brs(f,t)+'</div><div class="c"><h3>Data Quality Radar</h3>'+cw("rd")+'</div></div>';
  h+='<div class="g g2"><div class="c"><h3>Completeness</h3>'+cw("tc")+'</div><div class="c"><h3>Provenance</h3><div style="font-size:clamp(10px,0.95vw,12px);line-height:1.8;color:#888"><div>Sources: <b style="color:#e5a100">12</b></div><div>Per-season: <span style="color:#00c896">50/50</span></div><div>Per-episode: <span style="color:#00c896">699/699</span></div><div>Phases: <span style="color:#00b4d8">8</span></div><div>SHACL: 26 shapes</div><div>SPARQL: 22 queries</div><div>OWL v0.5.0</div></div></div></div>';
  ct.innerHTML=h;
  var rd=[{l:"Titles",v:Math.round(q.title/t*100)},{l:"Dates",v:Math.round(q.date/t*100)},{l:"Views",v:Math.round(q.view/t*100)},{l:"Notable",v:Math.round(q.notable/t*100)},{l:"Tribal",v:Math.round(q.tc/t*100)},{l:"Chal",v:Math.round(q.chal/t*100)},{l:"Detail",v:Math.round(q.detailed/t*100)}];
  mk("rd",{type:"radar",data:{labels:rd.map(function(r){return r.l}),datasets:[{data:rd.map(function(r){return r.v}),borderColor:"#e5a100",backgroundColor:"#e5a10015",borderWidth:2,pointBackgroundColor:"#e5a100",pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,scales:{r:{min:0,max:100,ticks:{font:{size:8},color:"#444",backdropColor:"transparent",stepSize:25},grid:{color:"#1a1b2a"},angleLines:{color:"#1a1b2a"},pointLabels:{font:{size:9},color:"#888"}}},plugins:{legend:{display:false}}}});
  mk("tc",{type:"doughnut",data:{labels:["Detailed ("+q.detailed+")","Season-level ("+(q["season-level"]||0)+")","Stub ("+(q.stub||0)+")"],datasets:[{data:[q.detailed,q["season-level"]||0,q.stub||0],backgroundColor:["#00c896","#e5a100","#e54040"],borderColor:"#11121c",borderWidth:2}]},options:{responsive:true,maintainAspectRatio:false,cutout:"50%",plugins:{legend:{position:"bottom",labels:{font:{size:9},color:"#888"}}}}});
}

function render(){destroyAll();[rOverview,rSeasons,rPlayers,rIdols,rGraph,rQuality][aTab]()}
render();
</script>
</body></html>
