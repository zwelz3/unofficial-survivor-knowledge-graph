<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Survivor Knowledge Graph</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08080f;color:#c8c8d8;font-family:'JetBrains Mono','Fira Code','SF Mono',monospace;overflow:hidden;height:100vh}
.header{padding:8px 12px;border-bottom:1px solid #1a1a28;display:flex;gap:8px;align-items:center;background:#0c0c16}
.header .title{font-size:11px;font-weight:800;color:#D97706;letter-spacing:1px}
.header input{background:#12121e;border:1px solid #2a2a3a;border-radius:4px;padding:4px 8px;color:#aaa;font-size:10px;width:160px;font-family:inherit;outline:none}
.header button{padding:3px 8px;font-size:9px;background:transparent;color:#555;border:1px solid transparent;border-radius:3px;cursor:pointer;font-family:inherit;text-transform:uppercase}
.header button.active{background:#1e1e3a;color:#D97706;border-color:#3a3a5a}
.sep{width:1px;height:16px;background:#222}
.main{flex:1;display:flex;overflow:hidden}
svg{flex:1;cursor:grab}
svg:active{cursor:grabbing}
.inspector{width:220px;border-left:1px solid #1a1a28;padding:12px;background:#0c0c16;overflow:auto;display:none}
.inspector.show{display:block}
.inspector .type{font-size:8px;color:#555;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.inspector .name{font-size:13px;font-weight:700;margin-bottom:8px}
.inspector .props{font-size:10px;color:#888;line-height:1.6}
.inspector .props span{color:#555}
.inspector .connections{margin-top:8px;display:flex;flex-wrap:wrap;gap:3px}
.inspector .connections button{padding:2px 5px;font-size:8px;background:#1a1a2e;border:1px solid #2a2a3a;border-radius:3px;cursor:pointer;font-family:inherit}
.legend{padding:6px 12px;border-top:1px solid #1a1a28;display:flex;gap:12px;align-items:center;background:#0c0c16}
.legend .item{display:flex;align-items:center;gap:4px;font-size:8px;color:#555}
.legend .dot{width:8px;height:8px;border-radius:50%}
.legend .spacer{flex:1}
label{font-size:9px;cursor:pointer;display:flex;align-items:center;gap:3px}
</style>
</head>
<body>
<div style="height:100vh;display:flex;flex-direction:column">
<div class="header">
  <div class="title">SURVIVOR GRAPH</div>
  <div class="sep"></div>
  <input id="search" placeholder="Search nodes...">
  <div class="sep"></div>
  <button class="active" onclick="setLayout('force')">Force</button>
  <button onclick="setLayout('radial')">Radial</button>
  <button onclick="setLayout('chrono')">Chrono</button>
  <div class="sep"></div>
  <label style="color:#D97706"><input type="checkbox" checked onchange="toggleType('S')"> Seasons</label>
  <label style="color:#3B82F6"><input type="checkbox" checked onchange="toggleType('P')"> Players</label>
  <div class="sep"></div>
  <span style="font-size:9px;color:#444">Neighbors:</span>
  <button class="active" onclick="setDegree(0)">All</button>
  <button onclick="setDegree(1)">1°</button>
  <button onclick="setDegree(2)">2°</button>
  <div class="spacer" style="flex:1"></div>
  <span id="counter" style="font-size:8px;color:#333"></span>
</div>
<div class="main">
  <svg id="graph"></svg>
  <div class="inspector" id="inspector">
    <div class="type" id="ins-type"></div>
    <div class="name" id="ins-name"></div>
    <div class="props" id="ins-props"></div>
    <div style="margin-top:8px;font-size:9px;color:#555" id="ins-conn-label"></div>
    <div class="connections" id="ins-connections"></div>
    <button onclick="clearSelection()" style="margin-top:16px;padding:4px 8px;font-size:9px;background:#1a1a2e;border:1px solid #2a2a3a;border-radius:3px;color:#666;cursor:pointer;font-family:inherit;width:100%">Clear selection</button>
  </div>
</div>
<div class="legend">
  <div class="item"><div class="dot" style="background:#D97706"></div>Classic (1-20)</div>
  <div class="item"><div class="dot" style="background:#7C3AED"></div>Modern (21-40)</div>
  <div class="item"><div class="dot" style="background:#059669"></div>New Era (41-50)</div>
  <div class="item"><div class="dot" style="background:#3B82F6"></div>Returning players</div>
  <div class="spacer"></div>
  <span style="font-size:8px;color:#333">scroll zoom / drag pan / click inspect</span>
</div>
</div>

hris-underwood-s38","r":"same_person"},{"s":"person-rick-devens","t":"contestant-rick-devens-s38","r":"same_person"},{"s":"person-rick-devens","t":"contestant-rick-devens-s38","r":"same_person"},{"s":"person-owen-knight","t":"contestant-owen-knight-s43","r":"same_person"},{"s":"person-owen-knight","t":"contestant-owen-knight-s43","r":"same_person"},{"s":"person-bruce-perreault","t":"contestant-bruce-perreault-s44","r":"same_person"},{"s":"person-bruce-perreault","t":"contestant-bruce-perreault-s45","r":"same_person"},{"s":"person-brandon-cottom","t":"contestant-brandon-cottom-s44","r":"same_person"},{"s":"person-brandon-cottom","t":"contestant-brandon-cottom-s44","r":"same_person"},{"s":"person-teeny-chirichillo","t":"contestant-teeny-chirichillo-s47","r":"same_person"},{"s":"person-teeny-chirichillo","t":"contestant-teeny-chirichillo-s49","r":"same_person"},{"s":"person-rachel-lamont","t":"contestant-rachel-lamont-s47","r":"same_person"},{"s":"person-rachel-lamont","t":"contestant-rachel-lamont-s47","r":"same_person"}]};
const EC={classic:"#D97706",modern:"#7C3AED",new_era:"#059669"};
const TC={S:"#D97706",P:"#3B82F6"};

let nodes=RAW.n.map(n=>({...n,radius:n.t==="S"?12:6+(n.tp||1)*1.5,color:n.t==="S"?(EC[n.era]||"#666"):TC[n.t]||"#888"}));
let nodeMap=new Map(nodes.map(n=>[n.id,n]));
let edges=RAW.e.filter(e=>nodeMap.has(e.s)&&nodeMap.has(e.t)).map(e=>({source:e.s,target:e.t,type:e.r,player:e.p}));

let showTypes={S:true,P:true};
let searchQ="";
let selectedId=null;
let neighborDeg=0;
let currentLayout="force";

const svg=d3.select("#graph");
const width=window.innerWidth-220;
const height=window.innerHeight-70;

const g=svg.append("g");
const zoom=d3.zoom().scaleExtent([0.2,5]).on("zoom",e=>g.attr("transform",e.transform));
svg.call(zoom);
svg.call(zoom.transform,d3.zoomIdentity.translate(width/2,height/2));

const linkGroup=g.append("g");
const nodeGroup=g.append("g");

const sim=d3.forceSimulation(nodes)
  .force("link",d3.forceLink(edges).id(d=>d.id).distance(d=>d.type==="same_person"?30:80).strength(d=>d.type==="same_person"?0.8:0.15))
  .force("charge",d3.forceManyBody().strength(d=>d.t==="S"?-200:-50))
  .force("center",d3.forceCenter(0,0))
  .force("collision",d3.forceCollide().radius(d=>d.radius+2))
  .alphaDecay(0.02)
  .on("tick",render);

function getNeighbors(id,deg){
  const visited=new Set([id]);
  let frontier=new Set([id]);
  for(let d=0;d<deg;d++){
    const next=new Set();
    for(const e of edges){
      const sid=typeof e.source==="object"?e.source.id:e.source;
      const tid=typeof e.target==="object"?e.target.id:e.target;
      if(frontier.has(sid)&&!visited.has(tid)){next.add(tid);visited.add(tid)}
      if(frontier.has(tid)&&!visited.has(sid)){next.add(sid);visited.add(sid)}
    }
    frontier=next;
  }
  return visited;
}

function getVisible(){
  let ids=new Set(nodes.filter(n=>showTypes[n.t]).map(n=>n.id));
  if(searchQ){const q=searchQ.toLowerCase();ids=new Set([...ids].filter(id=>{const n=nodeMap.get(id);return n&&(n.l.toLowerCase().includes(q)||(n.w||"").toLowerCase().includes(q))}));}
  if(selectedId&&neighborDeg>0){const nb=getNeighbors(selectedId,neighborDeg);ids=new Set([...ids].filter(id=>nb.has(id)));}
  return ids;
}

function render(){
  const vis=getVisible();
  document.getElementById("counter").textContent=vis.size+"/"+nodes.length+" nodes";

  const links=linkGroup.selectAll("line").data(edges.filter(e=>{
    const sid=typeof e.source==="object"?e.source.id:e.source;
    const tid=typeof e.target==="object"?e.target.id:e.target;
    return vis.has(sid)&&vis.has(tid);
  }),(_,i)=>i);
  links.join("line")
    .attr("x1",d=>d.source.x).attr("y1",d=>d.source.y)
    .attr("x2",d=>d.target.x).attr("y2",d=>d.target.y)
    .attr("stroke",d=>{
      const sid=typeof d.source==="object"?d.source.id:d.source;
      const tid=typeof d.target==="object"?d.target.id:d.target;
      if(selectedId&&(sid===selectedId||tid===selectedId))return"#F59E0B";
      return d.type==="returning_player"?"#F59E0B88":"#ffffff08";
    })
    .attr("stroke-width",d=>{
      const sid=typeof d.source==="object"?d.source.id:d.source;
      const tid=typeof d.target==="object"?d.target.id:d.target;
      if(selectedId&&(sid===selectedId||tid===selectedId))return 1.5;
      return d.type==="returning_player"?0.8:0.3;
    });

  const ns=nodeGroup.selectAll("g.node").data(nodes.filter(n=>vis.has(n.id)),d=>d.id);
  const enter=ns.enter().append("g").attr("class","node").style("cursor","pointer")
    .on("click",(_,d)=>{selectedId=selectedId===d.id?null:d.id;updateInspector();sim.alpha(0.01).restart();});
  enter.append("circle");
  enter.append("text").attr("text-anchor","middle").attr("font-family","inherit");

  const merged=enter.merge(ns);
  merged.attr("transform",d=>`translate(${d.x||0},${d.y||0})`);
  merged.select("circle")
    .attr("r",d=>d.radius)
    .attr("fill",d=>d.color)
    .attr("opacity",d=>selectedId&&selectedId!==d.id?0.3:0.85)
    .attr("stroke",d=>selectedId===d.id?"#F59E0B":d.t==="S"?"#ffffff20":"none")
    .attr("stroke-width",d=>selectedId===d.id?2:0.5);
  merged.select("text")
    .attr("y",d=>d.radius+10)
    .attr("fill",d=>selectedId===d.id?"#F59E0B":"#666")
    .attr("font-size",d=>d.t==="S"?7:6)
    .text(d=>(d.t==="S"||(d.tp&&d.tp>=3))?d.t==="S"?d.l.split(":")[0]:d.l.split(" ")[1]||d.l:"");

  ns.exit().remove();
}

function updateInspector(){
  const panel=document.getElementById("inspector");
  if(!selectedId){panel.classList.remove("show");return;}
  panel.classList.add("show");
  const n=nodeMap.get(selectedId);
  if(!n)return;
  document.getElementById("ins-type").textContent=n.t==="S"?"Season":"Returning Player";
  const nameEl=document.getElementById("ins-name");
  nameEl.textContent=n.l;
  nameEl.style.color=n.color;
  const props=document.getElementById("ins-props");
  if(n.t==="S"){
    props.innerHTML=`<div><span>Era:</span> ${n.era}</div><div><span>Winner:</span> ${n.w}</div><div><span>FTC:</span> ${n.v}</div><div><span>Cast:</span> ${n.c}</div><div><span>Location:</span> ${n.loc}</div>`;
  }else{
    props.innerHTML=`<div><span>Times played:</span> ${n.tp}</div><div><span>Seasons:</span> ${(n.ss||[]).join(", ")}</div>`;
  }
  const connLabel=document.getElementById("ins-conn-label");
  const connDiv=document.getElementById("ins-connections");
  connDiv.innerHTML="";
  const connected=edges.filter(e=>{
    const sid=typeof e.source==="object"?e.source.id:e.source;
    const tid=typeof e.target==="object"?e.target.id:e.target;
    return(sid===selectedId||tid===selectedId)&&e.type!=="same_person";
  });
  if(n.t==="S"){
    connLabel.textContent="Connected via returning players:";
    const seen=new Set();
    connected.forEach(e=>{
      const sid=typeof e.source==="object"?e.source.id:e.source;
      const tid=typeof e.target==="object"?e.target.id:e.target;
      const other=sid===selectedId?tid:sid;
      if(seen.has(other))return;seen.add(other);
      const on=nodeMap.get(other);
      if(!on)return;
      const btn=document.createElement("button");
      btn.textContent=on.l.split(":")[0]||other;
      btn.style.color=on.color;
      btn.onclick=()=>{selectedId=other;updateInspector();sim.alpha(0.01).restart();};
      connDiv.appendChild(btn);
    });
  }else{
    connLabel.textContent="Season appearances:";
    (n.ss||[]).forEach(sn=>{
      const sid=`season-${sn}`;
      const sNode=nodeMap.get(sid);
      const btn=document.createElement("button");
      btn.textContent="S"+sn;
      btn.style.color=sNode?sNode.color:"#888";
      btn.onclick=()=>{selectedId=sid;updateInspector();sim.alpha(0.01).restart();};
      connDiv.appendChild(btn);
    });
  }
}

function clearSelection(){selectedId=null;updateInspector();sim.alpha(0.01).restart();}

function setLayout(l){
  currentLayout=l;
  document.querySelectorAll(".header button").forEach(b=>{
    if(["force","radial","chrono"].includes(b.textContent.toLowerCase()))
      b.classList.toggle("active",b.textContent.toLowerCase()===l);
  });
  if(l==="force"){
    sim.force("radial",null).force("x",null).force("y",null);
    sim.force("center",d3.forceCenter(0,0));
    sim.alpha(0.3).restart();
  }else if(l==="radial"){
    sim.force("center",null);
    sim.force("radial",d3.forceRadial(d=>d.t==="S"?150+((d.id.match(/\d+/)||[0])[0]-1)*3:350,0,0).strength(0.8));
    sim.alpha(0.5).restart();
  }else if(l==="chrono"){
    sim.force("center",null).force("radial",null);
    sim.force("x",d3.forceX(d=>{
      if(d.t==="S"){const n=parseInt(d.id.replace("season-",""));return(n-25)*22;}
      if(d.ss)return((d.ss[0]+d.ss[d.ss.length-1])/2-25)*22;
      return 0;
    }).strength(0.8));
    sim.force("y",d3.forceY(d=>d.t==="S"?0:((d.tp||1)-1)*30+60).strength(0.3));
    sim.alpha(0.6).restart();
  }
}

function toggleType(t){showTypes[t]=!showTypes[t];sim.alpha(0.01).restart();}

function setDegree(d){
  neighborDeg=d;
  document.querySelectorAll(".header button").forEach(b=>{
    if(["All","1°","2°"].includes(b.textContent))
      b.classList.toggle("active",b.textContent===(d===0?"All":d+"°"));
  });
  sim.alpha(0.01).restart();
}

document.getElementById("search").addEventListener("input",e=>{searchQ=e.target.value;sim.alpha(0.01).restart();});
</script>
</body>
</html>
